name: Build Zirconium Custom

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - .github/workflows/build.yml
      - updates/**
  schedule:
    # Every six hours, away from the busy start of the hour (UTC).
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild unchanged inputs (starts a new 14-day wait)
        type: boolean
        default: false
      block_digest:
        description: Block an unpromoted candidate (full sha256 digest)
        type: string
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check update logic
        run: python3 -m unittest discover -s updates/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect changes, build candidates, and promote aged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          BLOCK_DIGEST: ${{ inputs.block_digest }}
        run: python3 updates/pipeline.py
